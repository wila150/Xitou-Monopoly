services:
  - name: line-checkpoint-system
    type: web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: line-checkpoint-db
          property: connectionString
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: ADMIN_PANEL_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Taipei

databases:
  - name: line-checkpoint-db
    plan: free
